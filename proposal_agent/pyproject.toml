[project]
name = "proposal-site-publisher-agent"
version = "0.1.0"
description = "Interactive Proposal Concierge & HTML5 Presentation Site Publisher Agent for Gemini Enterprise"
authors = [
    {name = "Contributors", email = "noreply@example.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "google-cloud-storage>=3.13.1",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "google-cloud-discoveryengine>=0.13.12",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
